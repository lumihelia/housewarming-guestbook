<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helia弟弟的新居宴 🎉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 配置 Supabase
        const SUPABASE_URL = 'https://llcclppmxpvelhfqspef.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsY2NscHBteHB2ZWxoZnFzcGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NjExMjksImV4cCI6MjA4NTAzNzEyOX0.W90wkhWiRVXyk4KzL_tbKdxO33qb3ji07QZPhw_957I';

        let supabase;

        function guestbook() {
            return {
                loadingInitial: true,
                sending: false,
                newName: '',
                newText: '',
                messages: [],

                async initSupabase() {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    await this.fetchMessages();
                    supabase
                        .channel('guestbook_channel')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guestbook' }, (payload) => {
                            const newMsg = payload.new;
                            this.messages.unshift({
                                id: newMsg.id,
                                name: newMsg.name,
                                text: newMsg.message,
                                created_at: newMsg.created_at
                            });
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        })
                        .subscribe();
                },

                async fetchMessages() {
                    const { data, error } = await supabase
                        .from('guestbook')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!error && data) {
                        this.messages = data.map(row => ({
                            id: row.id,
                            name: row.name,
                            text: row.message,
                            created_at: row.created_at
                        }));
                    }
                    this.loadingInitial = false;
                },

                async addMessage() {
                    if (!this.newName.trim() || !this.newText.trim()) return;
                    this.sending = true;

                    const { error } = await supabase
                        .from('guestbook')
                        .insert([
                            { name: this.newName, message: this.newText }
                        ]);

                    if (!error) {
                        this.newText = '';
                    } else {
                        alert('Failed to send. Please try again.');
                        console.error(error);
                    }
                    this.sending = false;
                },

                formatDate(isoString) {
                    if (!isoString) return '';
                    const date = new Date(isoString);
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
            }
        }
    </script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .float-in {
            animation: floatIn 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes floatIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-orange-100 via-amber-100 to-yellow-50 min-h-screen text-stone-800"
    x-data="guestbook()" x-init="initSupabase()">

    <!-- Main Container -->
    <div class="max-w-md mx-auto min-h-screen flex flex-col p-6 relative">

        <!-- Header -->
        <header class="text-center mb-8 pt-8">
            <div class="inline-block bg-white/50 rounded-full px-4 py-1 text-sm font-medium text-stone-500 mb-3">
                Jan 27, 2026 • Housewarming
            </div>
            <h1 class="text-3xl font-bold text-stone-800 tracking-tight mb-2">新居落成 🏡</h1>
            <p class="text-stone-600">留下一句祝福，溫暖這個新家。</p>
        </header>

        <!-- Message Wall (Display) -->
        <div class="flex-1 space-y-4 mb-24 overflow-y-auto pb-4 custom-scrollbar">
            <!-- Loading State -->
            <div x-show="loadingInitial" class="text-center text-stone-400 py-10 animate-pulse">
                載入祝福中...
            </div>

            <template x-for="(msg, index) in messages" :key="msg.id || index">
                <div class="glass rounded-2xl p-5 shadow-sm float-in">
                    <p class="text-lg font-medium text-stone-800 mb-2 leading-relaxed" x-text="msg.text"></p>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-sm font-bold text-amber-600" x-text="msg.name"></span>
                        <span class="text-xs text-stone-400" x-text="formatDate(msg.created_at)"></span>
                    </div>
                </div>
            </template>

            <!-- Empty State -->
            <div x-show="!loadingInitial && messages.length === 0" class="text-center text-stone-400 py-10"
                style="display: none;">
                <p>還沒有人留言...<br>成為第一個送上祝福的人吧！✨</p>
            </div>
        </div>

        <!-- Input Area (Fixed Bottom) -->
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white/90 to-transparent">
            <div class="max-w-md mx-auto glass rounded-3xl p-2 shadow-lg ring-1 ring-black/5">
                <form @submit.prevent="addMessage" class="flex flex-col gap-2 p-2">
                    <input type="text" x-model="newName" placeholder="你的名字" required
                        class="w-full bg-transparent border-b border-stone-200 px-3 py-2 text-sm focus:outline-none focus:border-amber-500 transition-colors placeholder-stone-400">
                    <div class="flex gap-2">
                        <input type="text" x-model="newText" placeholder="寫下祝福..." required
                            class="flex-1 bg-white/50 rounded-xl px-4 py-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-200 transition-all placeholder-stone-400">
                        <button type="submit" :disabled="sending"
                            class="bg-stone-800 text-white rounded-xl px-5 py-3 font-medium hover:bg-stone-700 active:scale-95 transition-all flex items-center justify-center shadow-md disabled:opacity-50">
                            <span x-show="!sending">✨</span>
                            <span x-show="sending" class="animate-spin">↻</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

</body>

</html>
